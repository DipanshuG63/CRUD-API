<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Password recovery | Task API</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}
    body{background:#0b1520;color:#edf7f7;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}
    main{width:min(100%,460px);border:1px solid #284550;border-radius:18px;background:#102630;padding:32px;box-shadow:0 16px 65px #0005}
    h1{font-size:26px;margin:0 0 12px}p{line-height:1.55;color:#bdd4d8}
    label{display:block;margin:18px 0 7px;font-size:14px;font-weight:600}
    input,button{font:inherit;width:100%;border-radius:8px;padding:12px;border:1px solid #45666f}
    input{background:#071d24;color:white}
    button{margin-top:20px;background:#28c2a6;color:#051617;font-weight:700;cursor:pointer;border:0}
    button:disabled{opacity:.6;cursor:wait}
    #status{margin:18px 0 0;border-radius:8px;padding:12px;background:#183440;color:#e6f6ff;line-height:1.5}
    #status:empty{display:none}
    small{display:block;color:#a8bdc4;margin-top:22px}
    a{color:#64dcc4}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p id="intro">Enter your account email to receive a fresh password recovery link.</p>
    <div id="status" role="status" aria-live="polite"></div>

    <form id="request-form">
      <label for="email">Your registered email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@gmail.com">
      <button type="submit">Send password reset email</button>
    </form>

    <form id="change-form" hidden>
      <label for="password">New password (at least 8 characters)</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
      <button type="submit">Save new password</button>
    </form>

    <small>After resetting your password, return to <a href="/docs">Swagger UI</a> and log in using the same email and your new password. No new account is needed.</small>
  </main>
  <script>
    "use strict";
    // A verified Supabase email link redirects here with a short-lived session
    // in the URL fragment. Never store it or copy it into logs.
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    let accessToken = fragment.get("access_token");
    const issue = fragment.get("error_code") || fragment.get("error");
    const status = document.getElementById("status");
    const requestForm = document.getElementById("request-form");
    const changeForm = document.getElementById("change-form");
    const intro = document.getElementById("intro");
    window.history.replaceState(null, "", "/reset-password");

    function message(text) {
      status.textContent = text;
    }

    if (issue) {
      accessToken = null;
      message("The previous email link is expired or invalid. Request a fresh link below, then open the newest email once.");
    }

    if (accessToken) {
      requestForm.hidden = true;
      changeForm.hidden = false;
      intro.textContent = "Recovery link verified. Choose a new password for this account.";
    }

    async function post(url, body, token) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch(url, {
        method: "POST",
        headers,
        body: JSON.stringify(body),
        cache: "no-store",
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const button = requestForm.querySelector("button");
      button.disabled = true;
      message("Requesting a fresh recovery email...");
      try {
        await post("/auth/password-reset-request", { email });
        message("If this email is registered, a fresh reset link has been sent. Open only the most recent email. Keep this server running.");
      } catch (error) {
        message(error.message);
      } finally {
        button.disabled = false;
      }
    });

    changeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        message("Passwords do not match.");
        return;
      }
      const button = changeForm.querySelector("button");
      button.disabled = true;
      message("Updating password...");
      try {
        await post("/auth/password-reset", { password }, accessToken);
        accessToken = null;
        changeForm.reset();
        changeForm.hidden = true;
        intro.textContent = "Your password has been updated.";
        message("Success! Return to Swagger UI and log in with your new password.");
      } catch (error) {
        message(error.message + " If the link has expired, reload this page and request a fresh one.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
