name: A3 PostgreSQL Docker Compose verification
on:
  push:
    branches: [a3-docker-postgres]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure local-only development environment
        run: cp .env.example .env
      - name: Check no private environment file is tracked
        run: |
          ! git ls-files --error-unmatch .env
          docker compose config --quiet
      - name: Build and run application plus Postgres
        run: docker compose up -d --build --wait
      - name: Test complete CRUD and write persistence marker
        run: node test/smoke.js --persist-file /tmp/a3-persist-id
      - name: Stop both containers but keep the database volume
        run: docker compose down
      - name: Restart complete stack
        run: docker compose up -d --wait
      - name: Verify data remains in PostgreSQL
        run: node test/smoke.js --verify-persisted "$(cat /tmp/a3-persist-id)"
      - name: Capture real PostgreSQL query output
        run: |
          mkdir -p artifacts
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT id, title, done FROM tasks ORDER BY id;"' | tee artifacts/postgres-query-output.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture actual curl -i response
        run: curl -i http://localhost:3000/tasks | tee artifacts/curl-i-output.txt
      - name: Render actual SQL output as PNG
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/render_db_proof.py artifacts/postgres-query-output.txt docs/postgres-proof.png
          cp docs/postgres-proof.png artifacts/postgres-proof.png
      - name: Commit live database proof image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/postgres-proof.png
          git diff --cached --quiet || git commit -m "docs: render live PostgreSQL query results [skip ci]"
          git push origin HEAD:a3-docker-postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-postgres-proof
          path: artifacts/
          if-no-files-found: ignore
      - name: Print service logs if a check failed
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down
