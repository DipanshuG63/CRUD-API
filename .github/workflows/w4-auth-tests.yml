name: W4 Auth API tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Swagger schema and API startup
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: public-ci-placeholder-key
          PORT: 3000
        run: |
          node index.js > /tmp/w4-server.log 2>&1 &
          PID=$!
          trap "kill $PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl --fail-with-body http://localhost:3000/public/info
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/protected/profile)" = 401
          curl -fsS http://localhost:3000/docs/ >/dev/null
      - name: Capture genuine full-sized Swagger UI screenshots
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: public-ci-placeholder-key
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node scripts/capture-swagger.js
          file docs/swagger-auth.png docs/swagger-profile.png
      - name: Save fresh screenshots to the repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/swagger-auth.png docs/swagger-profile.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture real Swagger UI padlock screenshots [skip ci]"
            git push origin HEAD:main
          else
            echo "Screenshots already current."
          fi
